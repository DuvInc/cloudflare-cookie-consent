name: CI

# Pull requests only get the default read-only token, and nothing here needs
# more. No secret is referenced, and `pull_request` (never
# `pull_request_target`) means a fork's code cannot reach one.
#
# Note what CI does NOT do: deploy, or call Cloudflare. The tests run the engine
# under a stand-in for HTMLRewriter. The real one is exercised by hand with
# `npm run example` and `npm run check:example` (see AGENTS.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # No `npm install`: the engine has no dependencies and the tests need none.
      # wrangler lives in example/ and is only for running the example.
      - run: npm test
      # Every script and the example Worker must at least parse. A syntax error
      # in one that only runs by hand is otherwise found by somebody following
      # the README.
      - run: npm run check
      - run: node --check example/worker/index.ts
      # The build guard runs on the example site: it is a fixture for it.
      - run: node scripts/check-consent.mjs example/public
